<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SchoolSafe — Diagnostic connexion</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel-2:#1e222b;
    --ink:#e8eaf0; --muted:#9aa3b2; --line:#2a2f3a;
    --ok:#34d399; --bad:#f87171; --warn:#fbbf24; --accent:#7dd3fc;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:light){
    :root{--bg:#f6f7f9;--panel:#fff;--panel-2:#f0f2f5;--ink:#111826;--muted:#5b6472;--line:#e2e6ec;
          --ok:#059669;--bad:#dc2626;--warn:#b45309;--accent:#0369a1;}
  }
  *{box-sizing:border-box}
  body{margin:0 auto;padding:22px 16px 56px;background:var(--bg);color:var(--ink);
       font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:780px}
  h1{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
     margin:26px 0 10px;font-weight:700}
  .sub{color:var(--muted);font-size:13px;margin:0}
  button{width:100%;padding:14px 18px;border:0;border-radius:10px;background:var(--accent);
         color:#04121c;font:600 15px/1 inherit;cursor:pointer;margin-top:20px}
  @media (prefers-color-scheme:light){button{color:#fff}}
  button:disabled{opacity:.5;cursor:default}
  .test{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        padding:14px 16px;margin-top:12px}
  .head{display:flex;align-items:center;gap:10px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
  .dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)}
  .name{font-weight:600;font-size:14px}
  .verdict{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted);text-align:right}
  .verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)} .verdict.warn{color:var(--warn)}
  pre{margin:10px 0 0;padding:11px 12px;background:var(--panel-2);border-radius:8px;
      font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;
      max-height:220px;overflow:auto;color:var(--muted)}
  .hint{margin:9px 0 0;padding:10px 12px;border-left:3px solid var(--warn);
        background:var(--panel-2);border-radius:0 8px 8px 0;font-size:13px}
  .hint code{font:12px var(--mono);background:var(--bg);padding:1px 5px;border-radius:4px}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;font-weight:600}
  input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;
        background:var(--panel);color:var(--ink);font:13px/1.3 var(--mono)}
  .row{display:grid;gap:0}
  @media(min-width:620px){.row{grid-template-columns:1fr 1fr;gap:0 14px}}
</style>
</head>
<body>

<h1>Diagnostic connexion SchoolSafe</h1>
<p class="sub">Teste chaque couche indépendamment pour localiser où la connexion échoue.
Les valeurs sont utilisées uniquement dans ce navigateur — rien n'est envoyé ailleurs.</p>
<p class="sub" style="margin-top:6px">Page <strong>v11</strong> · 8 tests
<span id="jsok" style="color:var(--bad)">— script non démarré</span></p>
<div id="fatal" style="display:none;margin-top:14px;padding:12px 14px;border-radius:10px;
     background:rgba(248,113,113,.12);border:1px solid var(--bad);color:var(--bad);
     font:12px/1.5 var(--mono);white-space:pre-wrap"></div>

<h2>Projet central</h2>
<label for="cu">URL du central</label>
<input id="cu" value="https://xryfvakkuffmckyybkeo.supabase.co">
<label for="ck">Clé publishable du central <span style="font-weight:400">(sb_publishable_…)</span></label>
<input id="ck" value="sb_publishable_q4Mwf0wNzlNo8Lw-1TJ8NA_HYeZ3fkI">

<label for="fn">Nom de l'Edge Function</label>
<input id="fn" value="dynamic-api">

<h2>Admin PRODELI <span style="text-transform:none;letter-spacing:0;font-weight:400">— optionnel</span></h2>
<label for="af">Slug de la fonction admin <span style="font-weight:400">(la colonne URL, pas le nom affiché)</span></label>
<input id="af" value="clever-responder">
<label for="at">Token admin <span style="font-weight:400">(laisse vide pour ignorer ce test)</span></label>
<input id="at" placeholder="collé depuis les secrets de l'Edge Function" autocomplete="off">

<h2>Identifiants de test</h2>
<div class="row">
  <div><label for="lk">Clé de licence</label><input id="lk" value="LS-SAGE-2025-WISE"></div>
  <div><label for="nm">Nom</label><input id="nm" value="admin"></div>
</div>
<label for="pn">Code</label>
<input id="pn" value="69210561190">

<button id="run">Lancer le diagnostic</button>
<div id="out"></div>

<script>
// Signale toute erreur, y compris celles qui empêcheraient le bouton de
// fonctionner : « rien ne se passe » est le pire des messages d'erreur.
window.onerror = function (msg, src, line, col) {
  var f = document.getElementById('fatal');
  if (f) { f.style.display = 'block';
           f.textContent = 'Erreur script : ' + msg + '\n(ligne ' + line + ':' + col + ')'; }
  return false;
};
window.addEventListener('unhandledrejection', function (e) {
  var f = document.getElementById('fatal');
  if (f) { f.style.display = 'block';
           f.textContent = 'Requête échouée : ' + ((e.reason && e.reason.message) || e.reason); }
});

const out = document.getElementById('out');

// Toute requête a un délai maximal. Sans lui, un appel resté suspendu laisse
// son test sur « en cours… » pour toujours et bloque tous les suivants, qui
// s'exécutent en séquence.
function fetchT(url, opts, ms) {
  var ctrl = new AbortController();
  var to = setTimeout(function(){ ctrl.abort(); }, ms || 15000);
  opts = opts || {};
  opts.signal = ctrl.signal;
  return fetch(url, opts).then(
    function (r) { clearTimeout(to); return r; },
    function (e) {
      clearTimeout(to);
      if (e && e.name === 'AbortError') {
        var err = new Error('Délai dépassé (' + Math.round((ms||15000)/1000) + ' s) — aucune réponse');
        err.timeout = true;
        throw err;
      }
      throw e;
    }
  );
}
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const val = id => document.getElementById(id).value.trim().replace(/\/+$/,'');
const cut = (s, n = 1200) => s.length > n ? s.slice(0, n) + '\n… (tronqué)' : s;

function card(name){
  const el = document.createElement('div');
  el.className = 'test';
  el.innerHTML = `<div class="head"><span class="dot"></span><span class="name">${esc(name)}</span>
                  <span class="verdict">en cours…</span></div>`;
  out.appendChild(el);
  return (state, verdict, body, hint) => {
    el.querySelector('.dot').className = 'dot ' + state;
    const v = el.querySelector('.verdict');
    v.className = 'verdict ' + state; v.textContent = verdict;
    if (body) el.insertAdjacentHTML('beforeend', `<pre>${esc(cut(body))}</pre>`);
    if (hint) el.insertAdjacentHTML('beforeend', `<div class="hint">${hint}</div>`);
  };
}

// Détecte le message Supabase « legacy keys disabled » dans une réponse
const isLegacyDisabled = txt => /legacy api keys are disabled/i.test(txt || '');
const LEGACY_HINT = 'Cette clé est une ancienne clé <code>anon</code>/<code>service_role</code>, désactivée sur ce projet. Récupère la clé <strong>publishable</strong> dans <em>Project Settings → API Keys</em> — elle commence par <code>sb_publishable_</code>.';

(function(){ var j=document.getElementById('jsok');
  if(j){ j.textContent='— script actif'; j.style.color='var(--ok)'; } })();

document.getElementById('run').onclick = async () => {
  out.innerHTML = '';
  document.getElementById('fatal').style.display = 'none';
  const btn = document.getElementById('run');
  btn.disabled = true; btn.textContent = 'Diagnostic en cours…';

  const CENTRAL = val('cu'), CKEY = val('ck');
  const license = val('lk'), name = val('nm'), pin = val('pn');
  const FN = val('fn') || 'login';
  const FN_URL = `${CENTRAL}/functions/v1/${FN}`;
  const H = { apikey: CKEY, Authorization: 'Bearer ' + CKEY };

  // ── 0. Quelle version de la fonction est réellement en ligne ────────────
  // Placé en premier : sans cette information, chaque échec plus bas se
  // confond avec « le redéploiement n'a pas eu lieu ».
  const t0 = card('0. Version déployée de la Passerelle École');
  let fnVer = null;
  try {
    const r = await fetchT(FN_URL, {
      method: 'POST',
      headers: { ...H, 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'version' }),
    });
    const txt = await r.text();
    let d = null; try { d = JSON.parse(txt); } catch(_){}
    if (d?.version) {
      fnVer = d;
      const r2 = d.r2 || {};
      const manque = ['account','key_id','secret'].filter(k => !r2[k])
        .concat(r2.bucket ? [] : ['bucket'])
        .concat(r2.public_base ? [] : ['public_base']);
      t0(r2.ready && r2.public_base ? 'ok' : 'warn',
         d.version,
         JSON.stringify(d, null, 2),
         (r2.ready && r2.public_base) ? null
           : `Secrets R2 incomplets : <code>${manque.join('</code>, <code>')}</code>.`);
    } else if (/license_key requis/i.test(d?.error || '')) {
      t0('bad', 'version ancienne', txt,
        'Cette version ne connaît pas l\'action <code>version</code> — donc ni les commandes de cartes, ni R2. <strong>Le redéploiement n\'a pas été appliqué.</strong>');
    } else {
      t0('warn', 'réponse inattendue', txt);
    }
  } catch (e) {
    t0('bad', e.timeout ? 'délai dépassé' : 'injoignable', String(e.message || e),
      e.timeout
        ? 'La fonction accepte la connexion mais ne répond jamais — signe qu\'elle plante au démarrage (import impossible, erreur de module). Ouvre ses <em>Logs</em> dans le dashboard : l\'erreur de démarrage y figure.'
        : 'Aucune réponse à cette adresse : soit le slug est faux, soit la fonction n\'existe pas.');
  }

  // ── 1. Le central répond et la clé publishable est acceptée ─────────────
  const t1 = card('1. Central joignable — clé publishable valide');
  let keyOk = false;
  if (!CKEY) {
    t1('bad', 'clé manquante', null, 'Renseigne la clé publishable du central ci-dessus.');
  } else {
    try {
      // school_sites est lisible publiquement : test parfait de validité de clé
      const r = await fetchT(`${CENTRAL}/rest/v1/school_sites?select=license_key&limit=1`, { headers: H });
      const txt = await r.text();
      if (isLegacyDisabled(txt))      t1('bad', 'clé legacy', txt, LEGACY_HINT);
      else if (r.status === 401)      t1('bad', '401', txt, 'Clé refusée — vérifie que tu as copié la clé <strong>publishable</strong> du BON projet.');
      else if (r.status === 404)      t1('bad', '404', txt, 'La table <code>school_sites</code> n\'existe pas — relance le SQL de setup du central.');
      else if (!r.ok)                 t1('bad', 'HTTP ' + r.status, txt);
      else { keyOk = true;            t1('ok', 'OK', 'Clé acceptée, REST opérationnel.'); }
    } catch (e) {
      t1('bad', 'réseau', String(e), 'URL du central injoignable — vérifie l\'adresse.');
    }
  }

  // ── 2. schools ne doit PAS être lisible côté client ──────────────────────
  const t2 = card('2. Table schools protégée (sécurité)');
  if (!keyOk) {
    t2('warn', 'ignoré', null, 'Nécessite le test 1.');
  } else {
    try {
      const r = await fetchT(`${CENTRAL}/rest/v1/schools?select=license_key,supabase_anon_key&limit=5`, { headers: H });
      const txt = await r.text();
      let rows = null; try { rows = JSON.parse(txt); } catch(_){}
      if (Array.isArray(rows) && rows.length > 0) {
        t2('bad', 'exposée', txt,
          'N\'importe quel visiteur peut lire les credentials de toutes les écoles. Lance <code>central_rls_hardening.sql</code> sur le central pour fermer cet accès.');
      } else {
        t2('ok', 'protégée', 'Aucune ligne lisible avec la clé publishable — correct.');
      }
    } catch (e) { t2('warn', 'non vérifiable', String(e)); }
  }

  // ── 3. Edge Function login : le vrai chemin de connexion ────────────────
  const t3 = card('3. Edge Function — ' + FN);
  let fn = null;
  try {
    const r = await fetchT(FN_URL, {
      method: 'POST',
      headers: { ...H, 'Content-Type': 'application/json' },
      body: JSON.stringify({ license_key: license, name, pin }),
    });
    const txt = await r.text();
    let d = null; try { d = JSON.parse(txt); } catch(_){}
    if (r.status === 404) {
      t3('bad', '404', txt, `Aucune fonction nommée <code>${esc(FN)}</code> sur ce projet. Vérifie le nom exact dans <em>Edge Functions</em> et corrige le champ ci-dessus.`);
    } else if (r.status === 401 && !d?.error) {
      t3('bad', '401 passerelle', txt, 'Rejet avant la fonction : clé refusée ou <em>Verify JWT</em> actif. Désactive <em>Verify JWT</em> sur la fonction.');
    } else if (d?.error && /CENTRAL_SECRET_KEY/.test(d.error)) {
      t3('bad', 'secret manquant', txt, 'Ajoute le secret <code>CENTRAL_SECRET_KEY</code> = la clé <code>sb_secret_…</code> du central, dans les secrets de l\'Edge Function.');
    } else if (!r.ok) {
      t3('bad', 'HTTP ' + r.status, txt, 'Message renvoyé par la fonction ci-dessus — il indique la cause exacte.');
    } else if (!d?.user || !d?.supabase_url) {
      t3('bad', 'réponse incomplète', txt, 'La fonction répond mais sans <code>user</code>/<code>supabase_url</code> : le code déployé n\'est pas la dernière version.');
    } else {
      fn = d;
      const sk0 = d.supabase_key || d.supabase_anon_key || '';
      const shown = { ...d };
      if (shown.supabase_key)      shown.supabase_key      = sk0.slice(0, 18) + '…';
      if (shown.supabase_anon_key) shown.supabase_anon_key = sk0.slice(0, 18) + '…';
      t3('ok', 'connexion OK', JSON.stringify(shown, null, 2));
    }
  } catch (e) {
    // « Failed to fetch » est opaque : on relance en no-cors pour savoir si
    // quelque chose répond à cette URL. Réponse opaque = la fonction existe
    // mais ses en-têtes CORS n'atteignent pas le navigateur (preflight rejeté,
    // typiquement Verify JWT actif). Échec total = rien ne répond.
    let reachable = false;
    try {
      const probe = await fetchT(FN_URL, { method: 'POST', mode: 'no-cors' });
      reachable = probe.type === 'opaque';
    } catch (_) {}
    if (reachable) {
      t3('bad', 'CORS bloqué', String(e),
        'La fonction répond, mais le navigateur ne reçoit pas ses en-têtes CORS — le preflight <code>OPTIONS</code> est rejeté en amont. Ouvre la fonction <code>login</code> dans le dashboard et <strong>désactive « Verify JWT »</strong> (parfois nommé <em>Enforce JWT verification</em>), puis redéploie.');
    } else {
      t3('bad', 'injoignable', String(e),
        `Rien ne répond à cette URL : la fonction n'est pas déployée, porte un autre nom que <code>${esc(FN)}</code>, ou plante au démarrage. Vérifie ses <em>Logs</em> dans le dashboard.`);
    }
  }

  // ── 4. Base de l'école accessible avec la clé renvoyée ──────────────────
  const t4 = card('4. Base de l\'école — table users');
  if (!fn?.supabase_url || !(fn.supabase_key || fn.supabase_anon_key)) {
    t4('warn', 'ignoré', null, 'Nécessite le test 3.');
  } else {
    try {
      const sk = fn.supabase_key || fn.supabase_anon_key;
      const r = await fetchT(`${fn.supabase_url}/rest/v1/users?select=id,name,role&limit=5`,
        { headers: { apikey: sk, Authorization: 'Bearer ' + sk } });
      const txt = await r.text();
      if (isLegacyDisabled(txt)) {
        t4('bad', 'clé legacy', txt,
          'La clé stockée dans <code>schools.supabase_anon_key</code> est une ancienne clé désactivée. Remplace-la par la clé <code>sb_publishable_…</code> du projet de l\'école.');
      } else if (!r.ok) {
        t4('bad', 'HTTP ' + r.status, txt, 'Lecture refusée : table <code>users</code> absente ou policies RLS manquantes. Relance <code>supabase_setup.sql</code> sur la base de l\'école.');
      } else {
        const u = JSON.parse(txt);
        t4(u.length ? 'ok' : 'warn', u.length ? u.length + ' compte(s)' : 'table vide',
          JSON.stringify(u, null, 2),
          u.length ? null : 'La table existe mais aucun compte : seul le code maître pourra ouvrir l\'app.');
      }
    } catch (e) { t4('bad', 'réseau', String(e)); }
  }

  // ── 5. Version de index.html réellement servie ──────────────────────────
  const t5 = card('5. Version de index.html servie');
  try {
    const r = await fetchT('./index.html?_=' + Date.now(), { cache: 'no-store' });
    const src = await r.text();
    const ck = (src.match(/CENTRAL_KEY\s*=\s*'([^']*)'/) || [])[1] || '';
    const fu = (src.match(/LOGIN_FN_URL\s*=\s*'([^']*)'/) || [])[1] || '(introuvable)';
    const newFmt = ck.startsWith('sb_publishable_');
    t5(newFmt ? 'ok' : 'warn', newFmt ? 'clés à jour' : 'clé legacy dans le code',
      'LOGIN_FN_URL = ' + fu + '\nCENTRAL_KEY  = ' + (ck.slice(0, 22) || '(vide)') + '…',
      newFmt ? null : 'Le code contient encore une clé JWT legacy. Envoie-moi la clé publishable pour que je mette à jour <code>index.html</code>.');
  } catch (e) { t5('warn', 'non vérifiable', String(e)); }

  // ── 5b. Écriture réelle dans la base de l'école ─────────────────────────
  // Décisif : si l'insertion échoue, l'app met ses écritures en file d'attente
  // et l'instantané serveur les écrase au rechargement — la donnée « se perd ».
  const tW = card('5b. Écriture dans la base de l\'école');
  if (!fn?.supabase_url) {
    tW('warn', 'ignoré', null, 'Nécessite le test 3.');
  } else {
    const sk = fn.supabase_key || fn.supabase_anon_key;
    const probe = {
      id: 'diag_' + Math.floor(performance.now()) + '_' + String(Math.trunc(performance.now()*1000)%100000),
      action: 'diagnostic', detail: 'Test d\'écriture depuis la page de diagnostic',
      by_name: 'Diagnostic', date: new Date().toISOString().slice(0,10),
      time: new Date().toTimeString().slice(0,5),
    };
    try {
      const r = await fetchT(`${fn.supabase_url}/rest/v1/audit_log`, {
        method: 'POST',
        headers: { apikey: sk, Authorization: 'Bearer ' + sk,
                   'Content-Type': 'application/json', Prefer: 'return=representation' },
        body: JSON.stringify(probe),
      });
      const txt = await r.text();
      if (r.ok) {
        tW('ok', 'écriture OK', 'Ligne créée dans audit_log :\n' + cut(txt, 400));
      } else if (r.status === 401 || r.status === 403 || /row-level security/i.test(txt)) {
        tW('bad', 'écriture refusée', txt,
          'La base de l\'école accepte la lecture mais refuse l\'écriture : les policies <code>INSERT</code>/<code>UPDATE</code> pour le rôle <code>anon</code> manquent. <strong>C\'est la cause d\'une donnée qui disparaît après rechargement.</strong> Relance <code>supabase_setup.sql</code> sur la base de l\'école.');
      } else if (r.status === 404) {
        tW('bad', 'table absente', txt, 'La table <code>audit_log</code> n\'existe pas — le script des 41 tables n\'a pas été appliqué entièrement.');
      } else {
        tW('bad', 'HTTP ' + r.status, txt);
      }
    } catch (e) {
      tW('bad', 'réseau', String(e));
    }
  }

  // ── 6. Stockage R2 de bout en bout ──────────────────────────────────────
  const t6 = card('6. Stockage R2 (signature → envoi → lecture)');
  try {
    const r = await fetchT(FN_URL, {
      method: 'POST',
      headers: { ...H, 'Content-Type': 'application/json' },
      body: JSON.stringify({ action:'storage_sign', license_key: license,
                             folder:'cards', name:'_diagnostic.png', contentType:'image/png' }),
    });
    const txt = await r.text();
    let d = null; try { d = JSON.parse(txt); } catch(_){}

    if (r.status === 503 || /R2 non configuré/i.test(d?.error || '')) {
      t6('warn', 'non configuré', txt,
        'R2 n\'est pas encore branché : les cartes voyageront en base64 dans la commande. Ajoute les 5 secrets <code>R2_*</code> puis redéploie la fonction.');
    } else if (/action inconnue|name et pin requis|pin requis/i.test(d?.error || '')) {
      t6('bad', 'fonction ancienne', txt,
        'La fonction déployée ne connaît pas l\'action <code>storage_sign</code> — redéploie-la avec la dernière version.');
    } else if (!r.ok || !d?.upload_url) {
      t6('bad', 'signature refusée', txt, d?.error ? '' : 'Réponse inattendue de la fonction.');
    } else {
      // 1×1 PNG transparent — charge utile minimale pour un aller-retour réel
      const b64 = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII=';
      const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      // L'envoi est isolé : un refus CORS lève une exception, à ne pas
      // confondre avec un problème de signature côté fonction.
      let up;
      try {
        up = await fetchT(d.upload_url, { method:'PUT', headers:{'Content-Type':'image/png'}, body:bin }, 25000);
      } catch (upErr) {
        if (upErr.timeout) {
          t6('bad', 'envoi sans réponse', 'Signature obtenue (clé : ' + d.key + ')\n' + String(upErr.message),
             'R2 n\'a pas répondu dans le délai imparti.');
          throw { handled: true };
        }
        // « Failed to fetch » ne distingue pas un blocage CORS d'un refus de
        // signature : R2 renvoie ses erreurs sans en-têtes CORS, donc le
        // navigateur masque le code dans les deux cas.
        //
        // On retente en no-cors : la requête PART réellement, seule la réponse
        // devient illisible. Si l'objet est ensuite accessible par son URL
        // publique, la signature était bonne et seule la politique CORS
        // manquait. Le Content-Type n'étant pas signé, l'envoi reste valide.
        let landed = false;
        try {
          await fetch(d.upload_url, { method:'PUT', mode:'no-cors', body: bin });
          await new Promise(function(res){ setTimeout(res, 1500); });
          if (d.public_url) {
            const chk = await fetchT(d.public_url + '?_=' + Math.floor(performance.now()), { cache:'no-store' }, 10000);
            landed = chk.ok;
          }
        } catch (_) {}

        if (landed) {
          t6('warn', 'envoi effectif, réponse masquée',
             'Signature valide et objet bien écrit :\n' + d.public_url,
             'L\'envoi <strong>fonctionne</strong> — le navigateur ne peut simplement pas lire la réponse de R2. Vérifie que la politique CORS du bucket expose <code>ETag</code> et couvre exactement l\'origine <code>' + esc(location.origin) + '</code>. L\'application, elle, téléversera correctement.');
        } else {
          t6('bad', 'envoi refusé par R2',
             'Signature obtenue (clé : ' + d.key + ')\nL\'objet n\'est pas arrivé dans le bucket.',
             'Deux causes possibles, indiscernables depuis un navigateur : la politique CORS ne couvre pas l\'origine <code>' + esc(location.origin) + '</code>, ou le jeton R2 n\'a pas la permission <strong>Object Read &amp; Write</strong> sur <code>prodeli-media</code>. Vérifie les deux.');
        }
        throw { handled: true };
      }
      if (!up.ok) {
        t6('bad', 'envoi refusé — HTTP ' + up.status, (await up.text()).slice(0, 600),
          'L\'URL est signée mais R2 refuse l\'écriture : vérifie que le jeton a la permission <strong>Object Read &amp; Write</strong> et que <code>R2_BUCKET</code> correspond au bucket réel.');
      } else if (!d.public_url) {
        t6('warn', 'envoyé, non lisible', 'Clé : ' + d.key,
          'Le fichier est bien stocké mais aucun domaine public n\'est configuré. Renseigne <code>R2_PUBLIC_BASE</code> avec l\'URL <code>pub-….r2.dev</code> du bucket.');
      } else {
        const back = await fetchT(d.public_url + '?_=' + Math.floor(performance.now()), { cache:'no-store' });
        t6(back.ok ? 'ok' : 'warn',
           back.ok ? 'bout en bout OK' : 'lecture HTTP ' + back.status,
           'Clé : ' + d.key + '\nURL publique : ' + d.public_url,
           back.ok ? null : 'Le fichier est envoyé mais pas servi publiquement — active <em>Public Development URL</em> sur le bucket.');
      }
    }
  } catch (e) {
    if (e && e.handled) { /* verdict déjà rendu ci-dessus */ }
    else t6('bad', e.timeout ? 'délai dépassé' : 'réseau', String(e.message || e),
      e.timeout ? 'Aucune réponse dans le délai imparti — voir le test 0.' : 'Appel impossible — voir le test 0.');
  }

  // ── 7. Edge Function admin-api (si un token est fourni) ─────────────────
  const ATOK = document.getElementById('at').value.trim();
  if (ATOK) {
    const AFN = val('af') || 'admin-api';
    const t7 = card('7. Edge Function admin — ' + AFN);
    const AURL = `${CENTRAL}/functions/v1/${AFN}`;
    try {
      const r = await fetchT(AURL, {
        method: 'POST',
        headers: { ...H, 'Content-Type': 'application/json', 'x-admin-token': ATOK },
        body: JSON.stringify({ action: 'stats' }),
      });
      const txt = await r.text();
      let d = null; try { d = JSON.parse(txt); } catch(_){}
      if (r.status === 404)                       t7('bad', '404', txt, `Aucune fonction à l'URL <code>${esc(AFN)}</code>. Dans Edge Functions, c'est la colonne <strong>URL</strong> qui compte, pas le nom affiché.`);
      else if (d?.error === 'Unauthorized')       t7('bad', 'token refusé', txt, 'Le token ne correspond pas au secret <code>ADMIN_TOKEN</code> de la fonction.');
      else if (/CENTRAL_SECRET_KEY/.test(d?.error || '')) t7('bad', 'secret manquant', txt, 'Ajoute <code>CENTRAL_SECRET_KEY</code> aux secrets du projet.');
      else if (!r.ok)                             t7('bad', 'HTTP ' + r.status, txt);
      else if (typeof d?.total !== 'number')      t7('warn', 'réponse inattendue', txt, 'La fonction répond mais pas au format attendu — le code déployé n\'est peut-être pas <code>admin-api</code>.');
      else                                        t7('ok', d.total + ' école(s)', JSON.stringify(d, null, 2));
    } catch (e) {
      let reachable = false;
      try { reachable = (await fetchT(AURL, { method:'POST', mode:'no-cors' }, 8000)).type === 'opaque'; } catch(_) {}
      t7('bad', reachable ? 'CORS bloqué' : 'injoignable', String(e),
        reachable ? `Soit le slug <code>${esc(AFN)}</code> est faux, soit <strong>Verify JWT</strong> est actif sur cette fonction.`
                  : 'Fonction non déployée, mal nommée, ou elle plante au démarrage (voir ses <em>Logs</em>).');
    }
  }

  btn.disabled = false; btn.textContent = 'Relancer le diagnostic';
};
</script>
