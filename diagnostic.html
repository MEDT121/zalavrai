<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SchoolSafe — Diagnostic</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel-2:#1e222b;
    --ink:#e8eaf0; --muted:#9aa3b2; --line:#2a2f3a;
    --ok:#34d399; --bad:#f87171; --warn:#fbbf24; --accent:#7dd3fc;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:light){
    :root{--bg:#f6f7f9;--panel:#fff;--panel-2:#f0f2f5;--ink:#111826;--muted:#5b6472;--line:#e2e6ec;
          --ok:#059669;--bad:#dc2626;--warn:#b45309;--accent:#0369a1;}
  }
  *{box-sizing:border-box}
  body{margin:0 auto;padding:22px 16px 56px;background:var(--bg);color:var(--ink);
       font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:780px}
  h1{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
     margin:26px 0 10px;font-weight:700}
  .sub{color:var(--muted);font-size:13px;margin:0}
  button{width:100%;padding:14px 18px;border:0;border-radius:10px;background:var(--accent);
         color:#04121c;font:600 15px/1 inherit;cursor:pointer;margin-top:20px}
  @media (prefers-color-scheme:light){button{color:#fff}}
  button:disabled{opacity:.5;cursor:default}
  .test{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        padding:14px 16px;margin-top:12px}
  .head{display:flex;align-items:center;gap:10px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
  .dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)}
  .name{font-weight:600;font-size:14px}
  .verdict{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted);text-align:right}
  .verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)} .verdict.warn{color:var(--warn)}
  pre{margin:10px 0 0;padding:11px 12px;background:var(--panel-2);border-radius:8px;
      font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;
      max-height:220px;overflow:auto;color:var(--muted)}
  .hint{margin:9px 0 0;padding:10px 12px;border-left:3px solid var(--warn);
        background:var(--panel-2);border-radius:0 8px 8px 0;font-size:13px}
  .hint code{font:12px var(--mono);background:var(--bg);padding:1px 5px;border-radius:4px}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;font-weight:600}
  input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;
        background:var(--panel);color:var(--ink);font:13px/1.3 var(--mono)}
  .row{display:grid;gap:0}
  @media(min-width:620px){.row{grid-template-columns:1fr 1fr;gap:0 14px}}
</style>
</head>
<body>

<h1>Diagnostic SchoolSafe</h1>
<p class="sub">Teste chaque couche séparément pour situer d'où vient une panne.
La clé n'est utilisée que dans ce navigateur — rien n'est envoyé ailleurs.
La sonde d'écriture supprime sa propre ligne.</p>
<p class="sub" style="margin-top:6px">Page <strong>v14</strong> · 8 tests · école unique
<span id="jsok" style="color:var(--bad)">— script non démarré</span></p>
<div id="fatal" style="display:none;margin-top:14px;padding:12px 14px;border-radius:10px;
     background:rgba(248,113,113,.12);border:1px solid var(--bad);color:var(--bad);
     font:12px/1.5 var(--mono);white-space:pre-wrap"></div>

<h2>Base de l'école</h2>
<label for="su">URL du projet Supabase</label>
<input id="su" value="https://loggezdryupyyuifzxky.supabase.co">
<label for="sk">Clé publiable <span style="font-weight:400">(sb_publishable_… — jamais sb_secret_)</span></label>
<input id="sk" placeholder="sb_publishable_…" autocomplete="off">

<button id="run">Lancer le diagnostic</button>
<div id="out"></div>

<script>
// Signale toute erreur, y compris celles qui empêcheraient le bouton de
// fonctionner : « rien ne se passe » est le pire des messages d'erreur.
window.onerror = function (msg, src, line, col) {
  var f = document.getElementById('fatal');
  if (f) { f.style.display = 'block';
           f.textContent = 'Erreur script : ' + msg + '\n(ligne ' + line + ':' + col + ')'; }
  return false;
};
window.addEventListener('unhandledrejection', function (e) {
  var f = document.getElementById('fatal');
  if (f) { f.style.display = 'block';
           f.textContent = 'Requête échouée : ' + ((e.reason && e.reason.message) || e.reason); }
});

const out = document.getElementById('out');

// Toute requête a un délai maximal. Sans lui, un appel resté suspendu laisse
// son test sur « en cours… » pour toujours et bloque tous les suivants, qui
// s'exécutent en séquence.
function fetchT(url, opts, ms) {
  var ctrl = new AbortController();
  var to = setTimeout(function(){ ctrl.abort(); }, ms || 15000);
  opts = opts || {};
  opts.signal = ctrl.signal;
  return fetch(url, opts).then(
    function (r) { clearTimeout(to); return r; },
    function (e) {
      clearTimeout(to);
      if (e && e.name === 'AbortError') {
        var err = new Error('Délai dépassé (' + Math.round((ms||15000)/1000) + ' s) — aucune réponse');
        err.timeout = true;
        throw err;
      }
      throw e;
    }
  );
}
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const val = id => document.getElementById(id).value.trim().replace(/\/+$/,'');
const cut = (s, n = 1200) => s.length > n ? s.slice(0, n) + '\n… (tronqué)' : s;

function card(name){
  const el = document.createElement('div');
  el.className = 'test';
  el.innerHTML = `<div class="head"><span class="dot"></span><span class="name">${esc(name)}</span>
                  <span class="verdict">en cours…</span></div>`;
  out.appendChild(el);
  return (state, verdict, body, hint) => {
    el.querySelector('.dot').className = 'dot ' + state;
    const v = el.querySelector('.verdict');
    v.className = 'verdict ' + state; v.textContent = verdict;
    if (body) el.insertAdjacentHTML('beforeend', `<pre>${esc(cut(body))}</pre>`);
    if (hint) el.insertAdjacentHTML('beforeend', `<div class="hint">${hint}</div>`);
  };
}

// Détecte le message Supabase « legacy keys disabled » dans une réponse
const isLegacyDisabled = txt => /legacy api keys are disabled/i.test(txt || '');
const LEGACY_HINT = 'Cette clé est une ancienne clé <code>anon</code>/<code>service_role</code>, désactivée sur ce projet. Récupère la clé <strong>publishable</strong> dans <em>Project Settings → API Keys</em> — elle commence par <code>sb_publishable_</code>.';

(function(){ var j=document.getElementById('jsok');
  if(j){ j.textContent='— script actif'; j.style.color='var(--ok)'; } })();

document.getElementById('run').onclick = async () => {
  out.innerHTML = '';
  document.getElementById('fatal').style.display = 'none';
  const btn = document.getElementById('run');
  btn.disabled = true; btn.textContent = 'Diagnostic en cours…';

  const SUPA = val('su'), KEY = val('sk');
  const H = { apikey: KEY, Authorization: 'Bearer ' + KEY };

  if (!KEY) {
    const t0 = card('Clé publiable');
    t0('bad', 'absente', null,
       'Colle la clé <code>sb_publishable_…</code> du projet dans le champ ci-dessus. ' +
       'Elle se trouve dans <em>Project Settings → API Keys</em>.');
    btn.disabled = false; btn.textContent = 'Relancer le diagnostic';
    return;
  }

  // ── 1. La base répond et accepte la clé ─────────────────────────────────
  const t1 = card('1. Base joignable — clé acceptée');
  let baseOk = false;
  try {
    const r = await fetchT(`${SUPA}/rest/v1/settings?select=id&limit=1`, { headers: H });
    const txt = await r.text();
    if (r.ok) { baseOk = true; t1('ok', 'HTTP ' + r.status, txt.slice(0, 200)); }
    else if (isLegacyDisabled(txt)) t1('bad', 'clé obsolète', txt, LEGACY_HINT);
    else t1('bad', 'HTTP ' + r.status, txt,
            r.status === 401 ? 'Clé refusée : vérifie qu\'elle vient bien de CE projet.'
                             : 'Le projet répond mais rejette la requête.');
  } catch (e) {
    t1('bad', e.timeout ? 'délai dépassé' : 'injoignable', String(e.message),
       'Vérifie l\'URL du projet, et que le projet n\'est pas en pause dans le tableau de bord Supabase.');
  }

  // ── 2. Les tables se lisent ─────────────────────────────────────────────
  const t2 = card('2. Lecture des tables — comptes, élèves, réglages');
  if (!baseOk) t2('warn', 'ignoré', 'La base n\'a pas répondu au test 1.');
  else {
    try {
      const noms = ['users', 'students', 'classes', 'settings'];
      const lignes = [];
      let echec = 0;
      for (const t of noms) {
        const r = await fetchT(`${SUPA}/rest/v1/${t}?select=id`, {
          headers: Object.assign({ Prefer: 'count=exact' }, H, { Range: '0-0' }),
        });
        const cr = r.headers.get('content-range') || '';
        const n = cr.indexOf('/') >= 0 ? cr.split('/')[1] : '?';
        if (!r.ok) echec++;
        lignes.push(t.padEnd(10) + (r.ok ? n + ' ligne(s)' : 'HTTP ' + r.status));
      }
      if (echec) t2('bad', echec + ' table(s) en échec', lignes.join('\n'),
                    'Une table refusée signale une policy SELECT manquante.');
      else t2('ok', 'toutes lisibles', lignes.join('\n'));
    } catch (e) { t2('bad', 'erreur', String(e.message)); }
  }

  // ── 3. Le schéma porte bien la migration ────────────────────────────────
  // Les colonnes les plus tardives de la migration consolidée : elles sont
  // ajoutées par une boucle unique, donc leur présence prouve l'ensemble.
  const t3 = card('3. Schéma — la migration est-elle passée ?');
  if (!baseOk) t3('warn', 'ignoré', 'La base n\'a pas répondu au test 1.');
  else {
    const temoins = [
      ['students', 'created_at'], ['students', 'school_id'],
      ['daily_records', 'ref'], ['cahier_prep', 'ct_id'],
      ['rattrapages', 'paid_date'], ['scan_log', 'escort_kind'],
      ['absences', 'validated_by'], ['messages', 'school_id'],
      ['advances', 'school_id'],
    ];
    const manquantes = [];
    try {
      for (const paire of temoins) {
        const r = await fetchT(
          `${SUPA}/rest/v1/${paire[0]}?select=${paire[1]}&limit=1`, { headers: H });
        if (!r.ok) {
          const txt = await r.text();
          if (/does not exist|42703|42P01/i.test(txt)) manquantes.push(paire[0] + '.' + paire[1]);
        }
      }
      if (manquantes.length) t3('bad', manquantes.length + ' colonne(s) absente(s)', manquantes.join('\n'),
        'Lance <code>supabase_migration_finale.sql</code> dans l\'éditeur SQL du projet. ' +
        'Tant qu\'une colonne manque, PostgREST rejette la ligne ENTIÈRE et les saisies se perdent en silence.');
      else t3('ok', '9 témoins présents', temoins.map(p => p[0] + '.' + p[1]).join('\n'));
    } catch (e) { t3('bad', 'erreur', String(e.message)); }
  }

  // ── 4. Écriture réelle, sans laisser de trace ───────────────────────────
  // La sonde passe par `notifs` et supprime sa ligne. Elle n'écrit surtout
  // pas dans `audit_log`, volontairement inaltérable : chaque exécution
  // polluerait le journal réel de l'école.
  const t4 = card('4. Écriture — une ligne créée puis retirée');
  if (!baseOk) t4('warn', 'ignoré', 'La base n\'a pas répondu au test 1.');
  else {
    const sondeId = 'diag_' + Date.now();
    try {
      const w = await fetchT(`${SUPA}/rest/v1/notifs`, {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }, H),
        body: JSON.stringify({ id: sondeId, uid: 'diagnostic', msg: 'Sonde de diagnostic',
                               date: new Date().toISOString().slice(0, 10), read: true }),
      });
      if (!w.ok) {
        const txt = await w.text();
        t4('bad', 'écriture refusée — HTTP ' + w.status, txt,
           w.status === 401 || w.status === 403
             ? 'Policy INSERT manquante sur <code>notifs</code>.'
             : 'Une colonne inconnue fait rejeter toute la ligne — relance la migration.');
      } else {
        const del = await fetchT(`${SUPA}/rest/v1/notifs?id=eq.${sondeId}`, { method: 'DELETE', headers: H });
        t4(del.ok ? 'ok' : 'warn',
           del.ok ? 'écriture et suppression réussies' : 'écrite, non supprimée',
           'Sonde : ' + sondeId,
           del.ok ? null : 'La ligne de sonde est restée en base — supprime-la à la main.');
      }
    } catch (e) { t4('bad', 'erreur', String(e.message)); }
  }

  // ── 5. Droits que l'application exige vraiment ──────────────────────────
  const t5 = card('5. Droits — enregistrer les réglages de l\'école');
  if (!baseOk) t5('warn', 'ignoré', 'La base n\'a pas répondu au test 1.');
  else {
    try {
      // L'application enregistre les réglages par upsert, qui est un INSERT
      // avec résolution de conflit : sans policy INSERT, tout est rejeté.
      const r = await fetchT(`${SUPA}/rest/v1/settings?on_conflict=id`, {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json',
                                 Prefer: 'resolution=merge-duplicates,return=minimal' }, H),
        body: JSON.stringify({ id: 'main' }),
      });
      const txt = r.ok ? '' : await r.text();
      if (r.ok) t5('ok', 'upsert accepté', 'Les réglages peuvent être enregistrés.');
      else t5('bad', 'HTTP ' + r.status, txt,
        'Il manque la policy INSERT sur <code>settings</code>. ' +
        'Sans elle, aucun réglage de l\'école ne peut être enregistré — ' +
        'relance <code>supabase_migration_finale.sql</code>.');
    } catch (e) { t5('bad', 'erreur', String(e.message)); }
  }

  // ── 6. Stockage des photos ──────────────────────────────────────────────
  // « Failed to fetch » ne prouve rien : un refus d'écriture et une absence
  // d'en-têtes CORS donnent le même message. On tranche par une relecture
  // publique de l'objet déposé.
  const t6 = card('6. Stockage — photos déposées et relues');
  if (!baseOk) t6('warn', 'ignoré', 'La base n\'a pas répondu au test 1.');
  else {
    const nom = 'diagnostic/sonde.txt';
    try {
      const w = await fetchT(`${SUPA}/storage/v1/object/photos/${nom}`, {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'text/plain', 'x-upsert': 'true' }, H),
        body: 'sonde',
      });
      if (!w.ok) {
        const txt = await w.text();
        t6('bad', 'dépôt refusé — HTTP ' + w.status, txt,
           /not found|bucket/i.test(txt)
             ? 'Le bucket <code>photos</code> n\'existe pas. Lance <code>supabase_stockage_photos.sql</code> dans l\'éditeur SQL.'
             : 'Le bucket existe mais refuse l\'écriture. Lance <code>supabase_stockage_photos.sql</code> : il pose les trois droits attendus.');
      } else {
        const pub = await fetchT(`${SUPA}/storage/v1/object/public/photos/${nom}`, {}, 8000);
        const corps = pub.ok ? await pub.text() : '';
        if (pub.ok && corps === 'sonde') {
          t6('ok', 'dépôt et relecture publique', nom);
        } else {
          t6('warn', 'déposé, relecture publique impossible', 'HTTP ' + pub.status,
             'Le bucket <code>photos</code> n\'est pas public : les photos se déposeraient ' +
             'sans jamais s\'afficher. Lance <code>supabase_stockage_photos.sql</code>.');
        }
        // Pas de suppression : l'application ne supprime jamais de photo,
        // donc le rôle `anon` n'a pas ce droit. Le nom étant fixe, la sonde
        // remplace la sienne au lieu d'en accumuler.
      }
    } catch (e) {
      t6('bad', e.timeout ? 'délai dépassé' : 'erreur', String(e.message),
         'Sans stockage, les photos restent en base64 dans la base : ' +
         'l\'application fonctionne, mais la base s\'alourdit vite.');
    }
  }

  // ── 7. Version de l'application réellement servie ───────────────────────
  const t7 = card('7. Application — version servie par le serveur');
  try {
    const r = await fetchT('index.html?nocache=' + Date.now(), { cache: 'no-store' });
    const src = await r.text();
    const cle = (src.match(/SCHOOL_SUPA_KEY\s*=\s*'([^']*)'/) || [])[1];
    const fn  = (src.match(/const LOGIN_FN_URL\s*=\s*'([^']*)'/) || [])[1];
    const det = 'Taille          : ' + Math.round(src.length / 1024) + ' Ko\n' +
                'Clé inscrite    : ' + (cle ? cle.slice(0, 22) + '…' : '(vide)') + '\n' +
                'Passerelle      : ' + (fn ? fn : '(débranchée — attendu)');
    if (fn) t7('warn', 'passerelle encore active', det,
      'LOGIN_FN_URL devrait être vide : l\'école ne passe plus par un service central.');
    else if (!cle) t7('warn', 'clé non inscrite', det,
      'L\'application demandera la clé à chaque nouvel appareil. ' +
      'Colle-la dans <code>SCHOOL_SUPA_KEY</code> pour que la connexion soit automatique.');
    else t7('ok', 'à jour', det);
  } catch (e) {
    t7('warn', 'non vérifiable', String(e.message),
       'Ouvre cette page depuis le même dossier que <code>index.html</code>.');
  }

  // ── 8. Saisies en attente sur cet appareil ──────────────────────────────
  const t8 = card('8. Saisies en attente sur cet appareil');
  try {
    const lire = (k) => { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch (e) { return []; } };
    const file  = lire('schoolsafe_sync_queue');
    const cote  = lire('schoolsafe_sync_parked');
    const refus = lire('_syncConflictLog').filter(function (r) { return r && r.motif; });

    const coinces = file.filter(function (i) { return (i.retries || 0) >= 2; });
    const parTable = {};
    file.forEach(function (i) { parTable[i.table] = (parTable[i.table] || 0) + 1; });
    const detail = Object.keys(parTable).sort(function (a, b) { return parTable[b] - parTable[a]; })
      .slice(0, 8).map(function (t) { return '  ' + t + ' x ' + parTable[t]; }).join('\n');

    const corps = 'En file          : ' + file.length +
                  (coinces.length ? '  (dont ' + coinces.length + ' en echec repete)' : '') +
                  '\nMises de cote    : ' + cote.length +
                  '\nRefus consignes  : ' + refus.length +
                  (detail ? '\n\nPar table :\n' + detail : '') +
                  (refus.length ? '\n\nDernier motif :\n  ' + String(refus[refus.length - 1].motif).slice(0, 220) : '');

    if (!file.length && !cote.length) {
      t8('ok', 'rien en attente', corps);
    } else if (cote.length) {
      t8('bad', cote.length + ' mise(s) de côté', corps,
        'Ces saisies ont épuisé leurs tentatives. Elles ne sont pas perdues : ouvre la file ' +
        'dans l\'application et appuie sur <strong>Remettre en file</strong>. Si elles échouent ' +
        'encore, le motif ci-dessus dit pourquoi.');
    } else if (coinces.length) {
      t8('warn', coinces.length + ' en échec répété', corps,
        'Le serveur refuse ces écritures. « column … does not exist » → lance ' +
        '<code>supabase_migration_finale.sql</code> · « row-level security » → un droit manque · ' +
        'sinon c\'est le réseau.');
    } else {
      t8('warn', file.length + ' en attente', corps,
         'Normal si tu viens de saisir ou si le réseau est lent — elles partiront seules.');
    }
  } catch (e) { t8('warn', 'non lisible', String(e.message)); }

  btn.disabled = false; btn.textContent = 'Relancer le diagnostic';
};
</script>
</body>
</html>
